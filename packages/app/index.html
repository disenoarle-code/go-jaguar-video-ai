<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Go Jaguar Video AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="shell" hidden></div>
  <div id="app" hidden>
    <header>
      <a class="brand small" href="#/"><img src="/logo.svg" alt="Go Jaguar" /><span>Video AI</span></a>
      <button id="back" data-ico="arrow-left">Proyectos</button>
      <input id="pname" type="text" aria-label="Nombre del proyecto" />
      <button id="save" data-ico="save" title="Ctrl/Cmd+S">Guardar</button>
      <span id="note" class="dim"></span>
      <span id="stats" class="dim right"></span>
    </header>
    <main>
      <section id="stage">
        <div class="canvaswrap"><canvas id="preview"></canvas><div id="loading">Cargando…</div></div>
        <div class="bar">
          <button id="play" data-ico="play" title="Espacio"></button>
          <span id="time" class="mono">0:00.00</span>
          <span class="sep"></span>
          <button id="undo" data-ico="undo" title="Ctrl/Cmd+Z"></button>
          <button id="redo" data-ico="redo" title="Ctrl/Cmd+Shift+Z"></button>
          <span class="sep"></span>
          <button id="split" data-ico="scissors" title="S">Cortar</button>
          <button id="del" data-ico="trash" title="Supr">Borrar</button>
          <button id="addsub" data-ico="plus">Subtítulo</button>
          <button id="addgfx" data-ico="plus">Gráfico</button>
          <span class="grow"></span>
          <button id="zout" data-ico="minus" title="Alejar"></button><button id="zin" data-ico="plus" title="Acercar"></button><button id="zfit">Ajustar</button>
        </div>
      </section>
      <aside id="inspector"></aside>
    </main>
    <section id="tl"><canvas id="timeline"></canvas></section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
