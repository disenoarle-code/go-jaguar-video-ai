<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Go Jaguar Video AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="shell" hidden></div>
  <div id="app" hidden>
    <header>
      <a class="brand small" href="#/"><img src="/logo.svg" alt="Go Jaguar" /><span>Video AI</span></a>
      <button id="back" data-ico="arrow-left" title="Volver a los proyectos">Proyectos</button>
      <input id="pname" type="text" readonly aria-label="Nombre del proyecto" title="Doble clic para cambiar el nombre" />
      <span class="grow"></span>
      <span id="note" class="dim"></span>
      <span id="savestate" class="dim" title="Todo se guarda solo, unos segundos después de cada cambio">Guardado</span>
      <button id="export" class="primary" data-ico="download" title="Exportar a MP4">Exportar</button>
      <span id="stats" hidden></span>
    </header>
    <main>
      <section id="stage">
        <div class="canvaswrap"><canvas id="preview"></canvas><div id="loading">Cargando…</div></div>
        <div class="player">
          <button id="play" data-ico="play" title="Reproducir / pausar (Espacio)"></button>
          <span id="time" class="mono">0:00.00</span>
        </div>
      </section>
      <aside id="inspector"></aside>
    </main>
    <div id="tlwrap">
      <div id="tools">
        <button id="undo" data-ico="undo" title="Deshacer (Ctrl/Cmd+Z)"></button>
        <button id="redo" data-ico="redo" title="Rehacer (Ctrl/Cmd+Shift+Z)"></button>
        <span class="sep"></span>
        <button id="split" data-ico="scissors" title="Cortar en el cabezal (S)"></button>
        <button id="del" data-ico="trash" title="Borrar lo seleccionado (Supr)"></button>
        <span class="sep"></span>
        <button id="addsub" data-ico="text" title="Agregar subtítulo"></button>
        <button id="addgfx" data-ico="graphic" title="Agregar gráfico"></button>
        <span class="grow"></span>
        <button id="zout" data-ico="zoom-out" title="Alejar"></button>
        <input id="zoomr" type="range" min="0" max="100" step="0.5" value="50" title="Zoom de la línea de tiempo" />
        <button id="zin" data-ico="zoom-in" title="Acercar"></button>
        <button id="zfit" data-ico="fit" title="Ajustar a la pantalla"></button>
      </div>
      <section id="tl"><canvas id="timeline"></canvas></section>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
